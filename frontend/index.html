  <style>
    /* App-wide font baseline so early-return screens (loading / error) never
       flash in the browser default serif before the main layout mounts. */
    body { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; }
    /* Remove browser spinner arrows from all number inputs app-wide */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  </style>
