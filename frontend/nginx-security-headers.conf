# Shared security headers.
#
# IMPORTANT: nginx only inherits add_header from an outer level when the inner
# level defines NO add_header of its own. Any location block that sets its own
# add_header (e.g. Cache-Control) therefore silently drops ALL of these unless
# it includes this file too. Include it in every such block.
#
# CSP notes:
#   style-src / font-src must allow Google Fonts — App.jsx and Landing.jsx
#     @import IBM Plex Sans, Space Mono and Syne from fonts.googleapis.com,
#     which serves the font files themselves from fonts.gstatic.com.
#   connect-src names the backend host EXACTLY rather than *.up.railway.app —
#     a wildcard would authorise every app on the shared Railway domain, not
#     just ours. Covers the API and the /api/analytics/event beacon.
#     If the backend URL changes, update it here as well as VITE_API_URL.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://backend-production-6057.up.railway.app; img-src 'self' data: https://flagcdn.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
