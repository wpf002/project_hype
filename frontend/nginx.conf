server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # Security headers — applied to every response.
    # CSP allows the Plausible analytics script and same-origin XHR/fetch to
    # the API host (Railway override sets connect-src per-environment via the
    # build, so we keep it permissive over HTTPS to avoid breaking deploys).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; connect-src 'self' https://plausible.io https://*.up.railway.app; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Proxy /api/* to the backend.
    # docker-compose: backend resolves via Docker DNS (127.0.0.11)
    # Railway: VITE_API_URL is baked in at build time — browser calls backend
    #          directly, so this block is never hit in production.
    # Using a variable in proxy_pass forces lazy DNS resolution so nginx
    # won't crash at startup if "backend" is unresolvable (Railway).
    resolver 127.0.0.11 8.8.8.8 valid=5s ipv6=off;
    set $backend_url "http://backend:8000";

    location /api/ {
        proxy_pass         $backend_url;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block access to dotfiles (e.g. .env, .git) just in case any leak in
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
