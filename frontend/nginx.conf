server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # Security headers — see nginx-security-headers.conf for the inheritance
    # caveat. Any location block below that sets its own add_header MUST
    # include this file again or it will serve no security headers at all.
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy /api/* to the backend.
    # docker-compose: backend resolves via Docker DNS (127.0.0.11)
    # Railway: VITE_API_URL is baked in at build time — browser calls backend
    #          directly, so this block is never hit in production.
    # Using a variable in proxy_pass forces lazy DNS resolution so nginx
    # won't crash at startup if "backend" is unresolvable (Railway).
    resolver 127.0.0.11 8.8.8.8 valid=5s ipv6=off;
    set $backend_url "http://backend:8000";

    location /api/ {
        proxy_pass         $backend_url;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so the browser always picks up the newest bundle
    location = /index.html {
        # This block defines add_header, so it must re-include the security
        # headers — nginx would otherwise drop every inherited one. The SPA
        # fallback in `location /` internally rewrites here, so without this
        # include the entire site would serve no CSP.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Block access to dotfiles (e.g. .env, .git) just in case any leak in
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
